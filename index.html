<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOTO — Arsip Foto Pribadi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-0: #121016;
            --bg-1: #1b1820;
            --bg-2: #242028;
            --line: #332e39;
            --amber: #e2a044;
            --amber-dim: #8a6a34;
            --amber-glow: rgba(226, 160, 68, 0.28);
            --paper: #f3ede0;
            --muted: #948d9c;
            --red: #c1666b;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(1100px 600px at 50% -10%, rgba(226, 160, 68, 0.07), transparent 60%),
                var(--bg-0);
            color: var(--paper);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::selection {
            background: var(--amber-glow);
            color: var(--paper);
        }

        /* ---------- scrollbar ---------- */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-0);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-2);
            border-radius: 10px;
        }

        /* ================= LOCK SCREEN ================= */
        #lock-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background:
                radial-gradient(650px 450px at 50% 38%, var(--amber-glow), transparent 65%),
                var(--bg-0);
            transition: opacity .6s ease, filter .6s ease;
        }

        #lock-screen.hidden {
            opacity: 0;
            filter: blur(6px);
            pointer-events: none;
        }

        .lock-card {
            width: min(360px, 88vw);
            text-align: center;
        }

        .aperture {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;
            position: relative;
        }

        .aperture svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .aperture circle.ring {
            fill: none;
            stroke: var(--amber-dim);
            stroke-width: 1.4;
        }

        .aperture .blade {
            fill: none;
            stroke: var(--amber);
            stroke-width: 1.6;
            stroke-linecap: round;
            transform-origin: 38px 38px;
            animation: blade-breathe 4s ease-in-out infinite;
        }

        @keyframes blade-breathe {

            0%,
            100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }

        .lock-eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: .28em;
            color: var(--amber-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .lock-title {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 34px;
            margin: 0 0 6px;
            color: var(--paper);
        }

        .lock-sub {
            color: var(--muted);
            font-size: 13.5px;
            margin: 0 0 34px;
        }

        .pw-row {
            position: relative;
            margin-bottom: 18px;
        }

        #pw-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            color: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            letter-spacing: .35em;
            text-align: center;
            padding: 10px 4px 12px;
            outline: none;
            transition: border-color .25s ease;
        }

        #pw-input:focus {
            border-color: var(--amber);
        }

        #pw-input.shake {
            animation: shake .38s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(7px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        #unlock-btn {
            width: 100%;
            background: var(--amber);
            color: #1b1305;
            border: none;
            border-radius: 999px;
            padding: 13px 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
            box-shadow: 0 8px 24px -8px var(--amber-glow);
        }

        #unlock-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px -8px var(--amber-glow);
        }

        #unlock-btn:active {
            transform: translateY(0);
        }

        .lock-error {
            min-height: 18px;
            color: var(--red);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            letter-spacing: .05em;
            margin-top: 14px;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .lock-error.show {
            opacity: 1;
        }

        /* ================= APP ================= */
        #app {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 28px 80px;
            display: none;
        }

        #app.visible {
            display: block;
        }

        header.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 34px 0 26px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 34px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 100%;
            height: 100%;
        }

        .brand-text .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: .25em;
            color: var(--amber-dim);
            text-transform: uppercase;
        }

        .brand-text h1 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 23px;
            margin: 1px 0 0;
            color: var(--paper);
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--line);
            background: var(--bg-1);
            color: var(--paper);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: border-color .2s ease, background .2s ease, transform .15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--amber-dim);
            background: var(--bg-2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--amber);
            color: #1b1305;
            border-color: var(--amber);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #eab35e;
            border-color: #eab35e;
        }

        .btn-ghost {
            background: transparent;
        }

        .btn-danger {
            border-color: rgba(193, 102, 107, .4);
            color: var(--red);
            background: transparent;
        }

        .btn-danger:hover {
            background: rgba(193, 102, 107, .1);
            border-color: var(--red);
        }

        .btn svg {
            width: 14px;
            height: 14px;
        }

        /* ---------- section label ---------- */
        .section-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: .22em;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* ================= ALBUM GRID ================= */
        #albums-view {}

        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
        }

        .album-card {
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
            position: relative;
        }

        .album-card:hover {
            transform: translateY(-4px);
            border-color: var(--amber-dim);
            box-shadow: 0 16px 32px -18px rgba(0, 0, 0, .6);
        }

        .album-cover {
            height: 150px;
            background: var(--bg-2);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .album-cover .empty-icon {
            width: 34px;
            height: 34px;
            color: var(--line);
        }

        .perf {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }

        .perf span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--bg-0);
        }

        .perf.top {
            top: 8px;
        }

        .perf.bottom {
            bottom: 8px;
        }

        .album-info {
            padding: 14px 16px 16px;
        }

        .album-name {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 16.5px;
            color: var(--paper);
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--muted);
            letter-spacing: .06em;
        }

        .new-album-card {
            border: 1.5px dashed var(--line);
            border-radius: var(--radius);
            min-height: 216px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            color: var(--muted);
            transition: border-color .2s ease, color .2s ease, background .2s ease;
            background: transparent;
        }

        .new-album-card:hover {
            border-color: var(--amber-dim);
            color: var(--amber);
            background: rgba(226, 160, 68, 0.04);
        }

        .new-album-card svg {
            width: 26px;
            height: 26px;
        }

        .new-album-card span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* ---------- empty state ---------- */
        .empty-state {
            text-align: center;
            padding: 70px 20px;
            border: 1px dashed var(--line);
            border-radius: var(--radius);
        }

        .empty-state svg {
            width: 44px;
            height: 44px;
            color: var(--line);
            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 21px;
            margin: 0 0 8px;
            color: var(--paper);
        }

        .empty-state p {
            color: var(--muted);
            font-size: 13.5px;
            margin: 0 0 22px;
        }

        /* ================= ALBUM DETAIL ================= */
        #album-view {
            display: none;
        }

        #album-view.visible {
            display: block;
        }

        .back-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            letter-spacing: .08em;
            text-transform: uppercase;
            background: none;
            border: none;
            padding: 0;
            transition: color .2s ease;
        }

        .back-btn:hover {
            color: var(--amber);
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
        }

        .album-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .album-header h2 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 32px;
            margin: 0;
            color: var(--paper);
        }

        .album-header .count {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .08em;
            margin-top: 4px;
        }

        .album-header-actions {
            display: flex;
            gap: 10px;
        }

        #drop-zone {
            border: 1.5px dashed var(--line);
            border-radius: var(--radius);
            padding: 34px 20px;
            text-align: center;
            margin-bottom: 28px;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease;
            color: var(--muted);
        }

        #drop-zone.drag-over {
            border-color: var(--amber);
            background: rgba(226, 160, 68, 0.06);
            color: var(--amber);
        }

        #drop-zone svg {
            width: 26px;
            height: 26px;
            margin-bottom: 10px;
        }

        #drop-zone p {
            margin: 0;
            font-size: 13px;
        }

        #drop-zone span.hint {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            letter-spacing: .08em;
            color: var(--amber-dim);
            display: block;
            margin-top: 6px;
        }

        #file-input {
            display: none;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }

        .photo-tile {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-2);
            border: 1px solid var(--line);
            cursor: pointer;
        }

        .photo-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s ease;
        }

        .photo-tile:hover img {
            transform: scale(1.06);
        }

        .photo-tile .del-photo {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(18, 16, 22, 0.75);
            border: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .18s ease, background .18s ease;
            color: var(--paper);
        }

        .photo-tile:hover .del-photo {
            opacity: 1;
        }

        .del-photo:hover {
            background: var(--red);
            border-color: var(--red);
        }

        .del-photo svg {
            width: 13px;
            height: 13px;
        }

        /* ================= LIGHTBOX ================= */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(10, 9, 12, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        #lightbox.visible {
            display: flex;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .5);
        }

        #lightbox .lb-close {
            position: absolute;
            top: 26px;
            right: 30px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-1);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--paper);
        }

        #lightbox .lb-close:hover {
            border-color: var(--amber-dim);
        }

        #lightbox .lb-close svg {
            width: 16px;
            height: 16px;
        }

        /* ================= MODAL ================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: rgba(10, 9, 12, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-box {
            width: min(380px, 100%);
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 30px 26px 26px;
        }

        .modal-box h3 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 21px;
            margin: 0 0 18px;
            color: var(--paper);
        }

        .modal-box input[type="text"] {
            width: 100%;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 11px 13px;
            color: var(--paper);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
            transition: border-color .2s ease;
        }

        .modal-box input[type="text"]:focus {
            border-color: var(--amber-dim);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-2);
            border: 1px solid var(--line);
            padding: 12px 20px;
            border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: .04em;
            color: var(--paper);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
            z-index: 250;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width:560px) {
            .lock-title {
                font-size: 28px;
            }

            .album-header h2 {
                font-size: 26px;
            }

            header.topbar {
                padding-top: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- ============ LOCK SCREEN ============ -->
    <div id="lock-screen">
        <div class="lock-card">
            <div class="aperture">
                <svg viewBox="0 0 76 76">
                    <circle class="ring" cx="38" cy="38" r="34" />
                    <g class="blade">
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(0 38 38)" />
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(60 38 38)" />
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(120 38 38)" />
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(180 38 38)" />
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(240 38 38)" />
                        <path d="M38 12 L46 30 L38 38 Z" transform="rotate(300 38 38)" />
                    </g>
                </svg>
            </div>
            <div class="lock-eyebrow">Akses Privat</div>
            <h1 class="lock-title">FOTO</h1>
            <p class="lock-sub">Masukkan kata sandi untuk membuka arsip foto Anda</p>
            <div class="pw-row">
                <input type="password" id="pw-input" placeholder="••••••" autocomplete="off" maxlength="24">
            </div>
            <button id="unlock-btn">Buka FOTO</button>
            <div class="lock-error" id="lock-error">Kata sandi salah, coba lagi.</div>
        </div>
    </div>

    <!-- ============ APP ============ -->
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 30 30" fill="none">
                        <circle cx="15" cy="15" r="13" stroke="#e2a044" stroke-width="1.4" />
                        <circle cx="15" cy="15" r="4.5" stroke="#e2a044" stroke-width="1.4" />
                    </svg>
                </div>
                <div class="brand-text">
                    <div class="eyebrow">Arsip Pribadi</div>
                    <h1>FOTO</h1>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-ghost" id="lock-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
        Kunci
      </button>
            </div>
        </header>

        <!-- ---------- ALBUM GRID VIEW ---------- -->
        <div id="albums-view">
            <div class="section-row">
                <span class="section-label">Album</span>
            </div>
            <div id="albums-empty" class="empty-state" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <circle cx="9" cy="10" r="1.6" />
                    <path d="M21 16l-5-5-4 4-3-3-5 5" />
                </svg>
                <h3>Belum ada album</h3>
                <p>Buat album pertama untuk mulai menyimpan foto Anda.</p>
                <button class="btn btn-primary" id="empty-new-album-btn">+ Buat Album</button>
            </div>
            <div class="album-grid" id="album-grid" style="display:none;"></div>
        </div>

        <!-- ---------- ALBUM DETAIL VIEW ---------- -->
        <div id="album-view">
            <div class="back-row">
                <button class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Semua Album
      </button>
            </div>
            <div class="album-header">
                <div>
                    <h2 id="album-title">Album</h2>
                    <div class="count" id="album-count">0 foto</div>
                </div>
                <div class="album-header-actions">
                    <button class="btn btn-danger" id="delete-album-btn">Hapus Album</button>
                    <button class="btn btn-primary" id="upload-btn">+ Unggah Foto</button>
                </div>
            </div>

            <div id="drop-zone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 16V4M12 4l-4 4M12 4l4 4" />
                    <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
                </svg>
                <p>Seret &amp; lepas foto di sini, atau klik untuk memilih</p>
                <span class="hint">JPG · PNG · WEBP</span>
                <input type="file" id="file-input" accept="image/*" multiple>
            </div>

            <div class="photo-grid" id="photo-grid"></div>
        </div>
    </div>

    <!-- ============ NEW ALBUM MODAL ============ -->
    <div class="modal-overlay" id="album-modal">
        <div class="modal-box">
            <h3>Album Baru</h3>
            <input type="text" id="new-album-name" placeholder="Nama album, mis. Liburan Bali" maxlength="40">
            <div class="modal-actions">
                <button class="btn btn-ghost" id="cancel-album-btn">Batal</button>
                <button class="btn btn-primary" id="confirm-album-btn">Buat</button>
            </div>
        </div>
    </div>

    <!-- ============ LIGHTBOX ============ -->
    <div id="lightbox">
        <div class="lb-close" id="lb-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </div>
        <img id="lb-img" src="" alt="Foto">
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* =========================================================
   KONFIGURASI
   Ganti kata sandi di bawah ini sesuai keinginan Anda.
========================================================= */
const FOTO_PASSWORD = "it123";

/* =========================================================
   STATE (tersimpan hanya selama sesi/tab ini terbuka)
========================================================= */
let albums = [];        // {id, name, photos:[{id, src, name}]}
let currentAlbumId = null;

/* =========================================================
   LOCK SCREEN
========================================================= */
const lockScreen = document.getElementById('lock-screen');
const pwInput = document.getElementById('pw-input');
const unlockBtn = document.getElementById('unlock-btn');
const lockError = document.getElementById('lock-error');
const app = document.getElementById('app');

function tryUnlock(){
  if(pwInput.value === FOTO_PASSWORD){
    lockScreen.classList.add('hidden');
    app.classList.add('visible');
    setTimeout(()=> lockScreen.style.display='none', 650);
  } else {
    lockError.classList.add('show');
    pwInput.classList.add('shake');
    setTimeout(()=>pwInput.classList.remove('shake'), 400);
    pwInput.value='';
    pwInput.focus();
  }
}
unlockBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
pwInput.addEventListener('input', ()=> lockError.classList.remove('show'));
window.addEventListener('load', ()=> pwInput.focus());

document.getElementById('lock-btn').addEventListener('click', ()=>{
  lockScreen.style.display='flex';
  requestAnimationFrame(()=> lockScreen.classList.remove('hidden'));
  app.classList.remove('visible');
  pwInput.value='';
  pwInput.focus();
});

/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* =========================================================
   RENDER: ALBUM GRID
========================================================= */
const albumGrid = document.getElementById('album-grid');
const albumsEmpty = document.getElementById('albums-empty');

function renderAlbums(){
  if(albums.length === 0){
    albumsEmpty.style.display='block';
    albumGrid.style.display='none';
    return;
  }
  albumsEmpty.style.display='none';
  albumGrid.style.display='grid';
  albumGrid.innerHTML='';

  albums.forEach(album=>{
    const card = document.createElement('div');
    card.className='album-card';
    const cover = album.photos[0];
    card.innerHTML = `
      <div class="album-cover">
        <div class="perf top">${'<span></span>'.repeat(8)}</div>
        ${cover ? `<img src="${cover.src}" alt="">` : `
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-4 4-3-3-5 5"/>
          </svg>`}
        <div class="perf bottom">${'<span></span>'.repeat(8)}</div>
      </div>
      <div class="album-info">
        <p class="album-name">${escapeHtml(album.name)}</p>
        <p class="album-meta">${album.photos.length} FOTO</p>
      </div>
    `;
    card.addEventListener('click', ()=> openAlbum(album.id));
    albumGrid.appendChild(card);
  });

  const newCard = document.createElement('div');
  newCard.className='new-album-card';
  newCard.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
    <span>Album Baru</span>
  `;
  newCard.addEventListener('click', openAlbumModal);
  albumGrid.appendChild(newCard);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================
   NEW ALBUM MODAL
========================================================= */
const albumModal = document.getElementById('album-modal');
const newAlbumName = document.getElementById('new-album-name');

function openAlbumModal(){
  albumModal.classList.add('visible');
  newAlbumName.value='';
  setTimeout(()=>newAlbumName.focus(), 80);
}
function closeAlbumModal(){ albumModal.classList.remove('visible'); }

document.getElementById('empty-new-album-btn').addEventListener('click', openAlbumModal);
document.getElementById('cancel-album-btn').addEventListener('click', closeAlbumModal);
albumModal.addEventListener('click', e=>{ if(e.target===albumModal) closeAlbumModal(); });

document.getElementById('confirm-album-btn').addEventListener('click', createAlbum);
newAlbumName.addEventListener('keydown', e=>{ if(e.key==='Enter') createAlbum(); });

function createAlbum(){
  const name = newAlbumName.value.trim();
  if(!name){ newAlbumName.focus(); return; }
  albums.push({ id: 'a'+Date.now(), name, photos: [] });
  closeAlbumModal();
  renderAlbums();
  showToast('Album "'+name+'" dibuat');
}

/* =========================================================
   ALBUM DETAIL VIEW
========================================================= */
const albumsView = document.getElementById('albums-view');
const albumView = document.getElementById('album-view');
const albumTitle = document.getElementById('album-title');
const albumCount = document.getElementById('album-count');
const photoGrid = document.getElementById('photo-grid');

function getCurrentAlbum(){ return albums.find(a=>a.id===currentAlbumId); }

function openAlbum(id){
  currentAlbumId = id;
  albumsView.style.display='none';
  albumView.classList.add('visible');
  renderAlbumDetail();
}

document.getElementById('back-btn').addEventListener('click', ()=>{
  currentAlbumId = null;
  albumView.classList.remove('visible');
  albumsView.style.display='block';
  renderAlbums();
});

function renderAlbumDetail(){
  const album = getCurrentAlbum();
  if(!album) return;
  albumTitle.textContent = album.name;
  albumCount.textContent = album.photos.length + ' foto';
  photoGrid.innerHTML='';
  album.photos.forEach(photo=>{
    const tile = document.createElement('div');
    tile.className='photo-tile';
    tile.innerHTML = `
      <img src="${photo.src}" alt="${escapeHtml(photo.name)}">
      <div class="del-photo" title="Hapus foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    `;
    tile.querySelector('img').addEventListener('click', ()=> openLightbox(photo.src));
    tile.querySelector('.del-photo').addEventListener('click', (e)=>{
      e.stopPropagation();
      deletePhoto(photo.id);
    });
    photoGrid.appendChild(tile);
  });
}

document.getElementById('delete-album-btn').addEventListener('click', ()=>{
  const album = getCurrentAlbum();
  if(!album) return;
  if(confirm('Hapus album "'+album.name+'" beserta semua fotonya?')){
    albums = albums.filter(a=>a.id!==currentAlbumId);
    currentAlbumId = null;
    albumView.classList.remove('visible');
    albumsView.style.display='block';
    renderAlbums();
    showToast('Album dihapus');
  }
});

function deletePhoto(photoId){
  const album = getCurrentAlbum();
  if(!album) return;
  album.photos = album.photos.filter(p=>p.id!==photoId);
  renderAlbumDetail();
  showToast('Foto dihapus');
}

/* =========================================================
   UPLOAD FOTO
========================================================= */
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');

document.getElementById('upload-btn').addEventListener('click', ()=> fileInput.click());
dropZone.addEventListener('click', ()=> fileInput.click());

fileInput.addEventListener('change', e=> handleFiles(e.target.files));

['dragenter','dragover'].forEach(evt=>{
  dropZone.addEventListener(evt, e=>{
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.add('drag-over');
  });
});
['dragleave','drop'].forEach(evt=>{
  dropZone.addEventListener(evt, e=>{
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove('drag-over');
  });
});
dropZone.addEventListener('drop', e=>{
  handleFiles(e.dataTransfer.files);
});

function handleFiles(fileList){
  const album = getCurrentAlbum();
  if(!album) return;
  const files = Array.from(fileList).filter(f=> f.type.startsWith('image/'));
  if(files.length===0) return;

  let loaded = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      album.photos.push({ id:'p'+Date.now()+Math.random().toString(16).slice(2), src:e.target.result, name:file.name });
      loaded++;
      if(loaded === files.length){
        renderAlbumDetail();
        showToast(files.length + ' foto ditambahkan');
      }
    };
    reader.readAsDataURL(file);
  });
  fileInput.value='';
}

/* =========================================================
   LIGHTBOX
========================================================= */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');

function openLightbox(src){
  lbImg.src = src;
  lightbox.classList.add('visible');
}
document.getElementById('lb-close').addEventListener('click', ()=> lightbox.classList.remove('visible'));
lightbox.addEventListener('click', e=>{ if(e.target===lightbox) lightbox.classList.remove('visible'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') lightbox.classList.remove('visible'); });

/* init */
renderAlbums();
    </script>
</body>

</html>
